<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check-in - Buffalo Training</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page-title="Buffalo Training - Check-in">

<div id="navbarMount"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div>
                <h1>Class Check-in</h1>
                <p>Check in to your active reservations when you arrive at the gym.</p>
            </div>

            <button id="reloadButton" type="button" class="secondary">Reload</button>
        </div>

        <div id="messageBox" class="message hidden"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Class</th>
                    <th>Coach</th>
                    <th>Reservation</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="reservationsTableBody">
                <tr>
                    <td colspan="6">Loading reservations...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div>
                <h2>My Attendance History</h2>
                <p>Your check-ins and validated attendances.</p>
            </div>

            <button id="reloadAttendanceButton" type="button" class="secondary">Reload Attendance</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Date / Time</th>
                    <th>Class</th>
                    <th>Method</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="attendanceTableBody">
                <tr>
                    <td colspan="4">Loading attendance...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/navbar.js"></script>
<script src="../../js/dashboard.js"></script>
<script src="../../js/athlete/check-in.js"></script>
</body>
</html>
