<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reservations - Buffalo Training</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page-title="Buffalo Training - Reservations">

<div id="navbarMount"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div>
                <h1>Reserve Class</h1>
                <p>View available class sessions and reserve your spot.</p>
            </div>

            <div class="inline-actions">
                <input type="date" id="classDateFilter">
                <button id="loadClassesButton" type="button" class="secondary">Load Classes</button>
            </div>
        </div>

        <div id="messageBox" class="message hidden"></div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Class</th>
                    <th>Coach</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="classesTableBody">
                <tr>
                    <td colspan="6">Loading classes...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div>
                <h2>My Reservations</h2>
                <p>Your active and past class reservations.</p>
            </div>

            <button id="reloadReservationsButton" type="button" class="secondary">Reload My Reservations</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Class</th>
                    <th>Coach</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="myReservationsTableBody">
                <tr>
                    <td colspan="6">Loading your reservations...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/navbar.js"></script>
<script src="../../js/dashboard.js"></script>
<script src="../../js/athlete/reservations.js"></script>
</body>
</html>
