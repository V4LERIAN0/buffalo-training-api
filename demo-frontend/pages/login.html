<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buffalo Training - Login</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="auth-container">
    <h1>Buffalo Training</h1>
    <p>Demo frontend login</p>

    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="admin@buffalotraining.fit">

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="admin123">

        <button type="submit">Login</button>
    </form>

    <div id="errorBox" class="error"></div>

    <div class="card">
        <h3>Test accounts</h3>
        <p><strong>Admin:</strong> admin@buffalotraining.fit</p>
        <p><strong>Coach:</strong> coach@buffalotraining.fit</p>
        <p><strong>Athlete:</strong> athlete@buffalotraining.fit</p>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
