<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Buffalo Training</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="navbar">
    <div class="navbar-title">Buffalo Training - Change Password</div>
    <div>
        <span id="userBox"></span>
        <button id="logoutButton" class="secondary">Logout</button>
    </div>
</div>

<div class="container">
    <h1>Change My Password</h1>
    <p>Use this page to update your own password.</p>

    <div class="card">
        <form id="changePasswordForm">
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" required>

            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" required minlength="6">

            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" required minlength="6">

            <button type="submit">Change Password</button>
        </form>

        <div id="passwordMessage"></div>
    </div>

    <p>
        <a id="backToDashboardLink" href="#">← Back to dashboard</a>
    </p>
</div>

<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/change-password.js"></script>
</body>
</html>
